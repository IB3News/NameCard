<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蔣友中 · IB³ News</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 390px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
    }

    /* ── Header strip ── */
    .header {
      background: #1a1a2e;
      padding: 28px 24px 20px;
      position: relative;
    }

    .avatar-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #fff;
      margin-bottom: 14px;
      background: #ccc;
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .role-tag {
      font-size: 11px;
      color: #a0a8c0;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .name-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .name-zh {
      font-size: 26px;
      font-weight: 700;
      color: #fff;
    }

    .name-en {
      font-size: 13px;
      color: #8890a8;
    }

    .tagline {
      margin-top: 6px;
      font-size: 13px;
      color: #c0c8e0;
    }

    /* ── Photo block ── */
    .photo-block {
      width: 100%;
      height: 220px;
      overflow: hidden;
      background: #e0e0e0;
    }

    .photo-block img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #bbb;
      font-size: 13px;
    }

    /* ── Info block ── */
    .info-block {
      margin: 16px;
      background: #f7f8fc;
      border-radius: 12px;
      padding: 14px 16px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e8eaf0;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 600;
      color: #1a1a2e;
    }

    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 13.5px;
      color: #444;
      line-height: 1.4;
    }

    .info-item:last-child { margin-bottom: 0; }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1a1a2e;
      flex-shrink: 0;
      margin-top: 4px;
    }

    /* ── CTA buttons ── */
    .cta-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 0 16px 16px;
    }

    .cta-btn {
      display: block;
      text-align: center;
      padding: 12px 8px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s;
    }

    .cta-btn:active { opacity: 0.75; }

    .btn-line {
      background: #06C755;
      color: #fff;
    }

    .btn-website {
      background: #1a1a2e;
      color: #fff;
    }

    /* ── Single full-width button ── */
    .cta-full {
      margin: 0 16px 16px;
    }

    .cta-full .cta-btn {
      width: 100%;
      display: block;
    }

    /* ── Footer ── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 16px;
    }

    .share-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #888;
      font-size: 12px;
    }

    .share-icon {
      font-size: 18px;
    }

    .powered {
      font-size: 11px;
      color: #bbb;
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- Header -->
    <div class="header">
      <div class="avatar-wrap">
        <!-- 換成你的頭像 URL -->
        <img src="https://via.placeholder.com/72" alt="avatar">
      </div>
      <div class="role-tag">創辦人 · Editor-in-Chief</div>
      <div class="name-row">
        <span class="name-zh">蔣友中</span>
        <span class="name-en">PJ Chiang</span>
      </div>
      <div class="tagline">媒體即資產，曝光會消失，資產會留下</div>
    </div>

    <!-- 主視覺照片（可換成品牌 banner） -->
    <div class="photo-block">
      <!-- 換成你的照片 URL，或刪掉整個 photo-block -->
      <div class="photo-placeholder">[ 個人照 / 品牌圖 ]</div>
      <!-- <img src="your-photo.jpg" alt="PJ Chiang"> -->
    </div>

    <!-- 品牌資訊 -->
    <div class="info-block">
      <div class="brand-row">
        <div class="brand-logo">IB³</div>
        <div class="brand-name">IB³ News · 心視界</div>
      </div>
      <div class="info-item">
        <div class="dot"></div>
        <span>身心靈產業專業新聞媒體</span>
      </div>
      <div class="info-item">
        <div class="dot"></div>
        <span>整合行銷 8+ 年｜身心靈產業 6+ 年</span>
      </div>
      <div class="info-item">
        <div class="dot"></div>
        <!-- 換成你的 email -->
        <span>pj@iceberg3.tw</span>
      </div>
    </div>

    <!-- CTA 按鈕 -->
    <div class="cta-row">
      <a href="https://line.me/ti/p/你的LINE_ID" class="cta-btn btn-line">LINE 聯繫</a>
      <a href="https://iceberg3.tw" class="cta-btn btn-website">官網</a>
    </div>

    <!-- Footer -->
    <div class="footer">
      <button class="share-btn" onclick="shareCard()">
        <span class="share-icon">⤴</span>
        <span>分享名片</span>
      </button>
      <span class="powered">iceberg3.tw</span>
    </div>

  </div>

  <script>
    function shareCard() {
      if (navigator.share) {
        navigator.share({
          title: '蔣友中 · IB³ News',
          text: '媒體即資產，曝光會消失，資產會留下',
          url: window.location.href
        });
      } else {
        navigator.clipboard.writeText(window.location.href).then(() => {
          alert('連結已複製');
        });
      }
    }
  </script>
</body>
</html>
